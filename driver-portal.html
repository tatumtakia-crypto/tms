    * { box-sizing: border-box;Here is a complete React/TypeScript component that fetches and displays real data directly from your Supabase `loads` table with no mock data or placeholder fallbacks.

```tsx
import { useEffect, useState } from 'react'
import { createClient } from '@supabase/supabase-js'

// Initialize Supabase client
const supabaseUrl = process.env.REACT_APP_SUPABASE_URL || ''
const supabaseAnonKey = process.env.REACT_APP_SUPABASE_ANON_KEY || ''
const supabase = createClient(supabaseUrl, supabaseAnonKey)

// Define Load interface matching your Supabase table schema
export interface Load {
  id: string | number
  origin: string
  destination: string
  status: string
  rate?: number
  created_at?: string
  [key: string]: any // Allows for additional custom columns
}

export default function SupabaseLoadsList() {
  const [loads, setLoads] = useState<Load[]>([])
  const [loading, setLoading] = useState<boolean>(true)
  const [error, setError] = useState<string | null>(null)

  useEffect(() => {
    async function fetchLoads() {
      try {
        setLoading(true)
        setError(null)

        const { data, error: supabaseError } = await supabase
          .from('loads')
          .select('*')

        if (supabaseError) {
          throw supabaseError
        }

        setLoads(data || [])
      } catch (err: any) {
        setError(err.message || 'Failed to fetch loads from Supabase')
      } finally {
        setLoading(false)
      }
    }

    fetchLoads()
  }, [])

  if (loading) {
    return <div className="p-4 text-gray-600">Loading loads from database...</div>
  }

  if (error) {
    return <div className="p-4 text-red-600">Error loading data: {error}</div>
  }

  if (loads.length === 0) {
    return <div className="p-4 text-gray-500">No loads found in the database.</div>
  }

  return (
    <div className="p-4">
      <h2 className="text-xl font-bold mb-4">Active Loads ({loads.length})</h2>
      <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
        {loads.map((load) => (
          <div key={load.id} className="border rounded-lg p-4 shadow-sm bg-white">
            <div className="flex justify-between items-center mb-2">
              <span className="font-semibold text-lg">Load #{load.id}</span>
              {load.status && (
                <span className="px-2 py-1 text-xs rounded bg-blue-100 text-blue-800 uppercase font-medium">
                  {load.status}
                </span>
              )}
            </div>
            <div className="text-sm text-gray-700 space-y-1">
              <p><strong>Origin:</strong> {load.origin || 'N/A'}</p>
              <p><strong>Destination:</strong> {load.destination || 'N/A'}</p>
              {load.rate !== undefined && (
                <p><strong>Rate:</strong> ${load.rate}</p>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  )
}
