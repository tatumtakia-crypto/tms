<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

  <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
    <div class="flex items-center space-x-3">
      <a href="index.html" class="text-2xl font-bold text-blue-500">FleetFlow</a>
      <span id="role-badge" class="text-xs bg-yellow-900 text-yellow-300 px-2.5 py-0.5 rounded-full font-semibold uppercase">Driver Portal</span>
    </div>

    <div class="flex space-x-6 text-sm font-medium">
      <a href="index.html" class="text-gray-300 hover:text-white transition">Home</a>
      <a href="dashboard.html" id="nav-dashboard" class="text-gray-300 hover:text-white transition">Dashboard</a>
      <a href="loadboard.html" id="nav-loadboard" class="text-gray-300 hover:text-white transition">Loadboard</a>
      <a href="driver-portal.html" class="text-yellow-400 font-bold">Driver Portal</a>
    </div>

    <div class="flex items-center space-x-3 text-sm">
      <a href="profile.html" class="flex items-center space-x-2 bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg border border-gray-600 transition">
        <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold" id="user-avatar">U</div>
        <span id="user-display-name" class="font-medium">Profile</span>
      </a>
      <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">
        Logout
      </button>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 py-8">
    <h1 class="text-3xl font-bold mb-6">Assigned Driver Loads</h1>

    <!-- Filter Bar (Admins can view all or search specific drivers) -->
    <div id="filter-bar" class="bg-gray-800 p-4 rounded-xl mb-6 border border-gray-700 flex items-center space-x-3">
      <label class="text-sm font-medium text-gray-300">Filtering Driver ID:</label>
      <input type="text" id="driver-filter" class="bg-gray-700 text-white px-3 py-1.5 rounded-lg border border-gray-600 text-sm" />
      <button onclick="fetchDriverLoads()" class="bg-yellow-600 hover:bg-yellow-500 px-4 py-1.5 rounded-lg text-sm font-medium">Filter</button>
    </div>

    <div id="driver-loads-container" class="space-y-4">
      <div class="text-center py-10 text-gray-400">Loading assigned loads...</div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let loggedInUser = null;
    let userRole = 'driver';

    async function initDriverPortal() {
      // Require Authentication
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      loggedInUser = user;

      // Fetch Profile from Supabase
      const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
      userRole = profile?.role || 'driver';
      const name = profile?.full_name || user.email.split('@')[0];

      document.getElementById('role-badge').innerText = userRole;
      document.getElementById('user-display-name').innerText = name;
      document.getElementById('user-avatar').innerText = name.charAt(0).toUpperCase();

      if (userRole === 'driver') {
        document.getElementById('nav-dashboard').classList.add('hidden');
        document.getElementById('nav-loadboard').classList.add('hidden');
        document.getElementById('driver-filter').value = user.id;
        document.getElementById('driver-filter').disabled = true; // Lock filter to logged-in driver
      }

      fetchDriverLoads();
    }

    async function fetchDriverLoads() {
      const targetDriverId = document.getElementById('driver-filter').value.trim() || loggedInUser.id;
      const container = document.getElementById('driver-loads-container');

      const { data: loads } = await supabase
        .from('loads')
        .select('*')
        .eq('driver_id', targetDriverId)
        .order('created_at', { ascending: false });

      if (!loads || loads.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-gray-500 bg-gray-800 rounded-xl border border-gray-700">No loads currently assigned to this driver ID.</div>`;
        return;
      }

      container.innerHTML = loads.map(load => `
        <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs px-2.5 py-1 rounded font-bold uppercase ${
              load.status === 'delivered' ? 'bg-green-900 text-green-300' : 'bg-blue-900 text-blue-300'
            }">${load.status || 'assigned'}</span>
            <span class="text-lg font-extrabold text-green-400">$${load.rate}</span>
          </div>
          <h2 class="text-xl font-bold">${load.origin} ➔ ${load.destination}</h2>
          <div class="pt-3 border-t border-gray-700 flex justify-between items-center">
            <span class="text-xs text-gray-400">Update Status:</span>
            <div class="space-x-2">
              <button onclick="updateLoadStatus('${load.id}', 'in_transit')" class="px-3 py-1 bg-yellow-600 text-xs rounded">In Transit</button>
              <button onclick="updateLoadStatus('${load.id}', 'delivered')" class="px-3 py-1 bg-green-600 text-xs rounded">Delivered</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function updateLoadStatus(loadId, newStatus) {
      await supabase.from('loads').update({ status: newStatus }).eq('id', loadId);
      fetchDriverLoads();
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    }

    initDriverPortal();
  </script>
</body>
</html>
