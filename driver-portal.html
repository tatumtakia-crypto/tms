<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastermind Matrix - Mobile Driver Terminal</title>
  <style>
    :root {
      --bg-primary: #060911;
      --bg-surface: #0f1626;
      --bg-card: #141f36;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --metallic-blue: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 50%, #1e40af 100%);
      --metallic-silver: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 50%, #64748b 100%);
      --border-metallic: 1px solid rgba(148, 163, 184, 0.25);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, system-ui, sans-serif; }
    
    body { background-color: var(--bg-primary); color: var(--text-main); padding: 1rem; max-width: 540px; margin: 0 auto; display: none; }
    
    .brand-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: var(--border-metallic); }
    .brand-title { font-size: 1.1rem; font-weight: 900; letter-spacing: 1.5px; background: var(--metallic-silver); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
    .brand-subtitle { font-size: 0.65rem; color: #06b6d4; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
    
    .header-btns { display: flex; gap: 0.5rem; align-items: center; }

    .nav-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .tab-btn { flex: 1; padding: 0.75rem; background: var(--bg-surface); border: var(--border-metallic); color: var(--text-muted); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; border-radius: 0.5rem; cursor: pointer; transition: all 0.3s; }
    .tab-btn.active { background: var(--metallic-blue); color: white; border-color: rgba(255,255,255,0.3); box-shadow: 0 0 12px rgba(59, 130, 246, 0.4); }

    .load-card { background: var(--bg-card); border: var(--border-metallic); border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
    .load-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--metallic-blue); }
    .load-card h3 { font-size: 1.05rem; margin-bottom: 0.5rem; color: #ffffff; letter-spacing: 0.5px; font-weight: 800; display: flex; justify-content: space-between; }
    .load-card .rate-tag { color: var(--success); font-weight: 800; font-size: 1.1rem; }
    .load-card p { margin-bottom: 0.4rem; font-size: 0.85rem; color: var(--text-muted); }
    .load-card p strong { color: var(--text-main); }
    
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; margin-top: 1rem; }
    .btn-driver { padding: 0.75rem; font-size: 0.8rem; font-weight: 700; border-radius: 0.5rem; border: var(--border-metallic); background: var(--metallic-blue); color: white; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 0.5px; width: 100%; text-align: center; }
    .btn-driver:hover { filter: brightness(1.2); box-shadow: 0 0 12px rgba(59, 130, 246, 0.5); }
    .btn-secondary { background: #1e293b; color: var(--text-main); }
    .btn-warning { background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); color: white; }
    .btn-action-sm { padding: 0.4rem 0.65rem; font-size: 0.75rem; font-weight: 700; border-radius: 0.375rem; border: var(--border-metallic); text-transform: uppercase; cursor: pointer; }
    .btn-logout { background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); color: white; }

    /* Upload Preview Box */
    .upload-container { margin-top: 0.75rem; padding: 0.75rem; background: #080d1a; border: 1px dashed rgba(148, 163, 184, 0.4); border-radius: 0.5rem; text-align: center; }
    .upload-preview { max-width: 100%; max-height: 140px; border-radius: 0.375rem; margin-top: 0.5rem; display: none; object-fit: contain; }
    
    /* Hidden file input */
    input[type="file"] { display: none; }

    /* Profile Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(5px); padding: 1rem; }
    .modal-card { background: var(--bg-surface); border: var(--border-metallic); border-radius: 1rem; width: 100%; max-width: 420px; padding: 1.5rem; box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative; }
    .modal-header { font-size: 1.1rem; font-weight: 900; background: var(--metallic-silver); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 1.25rem; border-bottom: var(--border-metallic); padding-bottom: 0.5rem; }
    .profile-field { margin-bottom: 0.85rem; }
    .profile-field label { display: block; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.2rem; font-weight: 700; }
    .profile-field div { font-size: 0.85rem; font-weight: 600; color: var(--text-main); background: #080d1a; padding: 0.65rem; border-radius: 0.5rem; border: var(--border-metallic); }
  </style>
</head>
<body>
  <div class="brand-header">
    <div>
      <div class="brand-title">Mastermind Matrix</div>
      <div class="brand-subtitle">Driver Terminal Pro</div>
    </div>
    <div class="header-btns">
      <button class="btn-action-sm btn-secondary" id="open-profile-btn">Profile</button>
      <button class="btn-action-sm btn-logout" id="logout-btn">Logout</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" id="tab-active" onclick="switchDriverTab('active')">My Active Loads (<span id="active-count">0</span>)</button>
    <button class="tab-btn" id="tab-board" onclick="switchDriverTab('board')">Load Board Pool (<span id="pool-count">0</span>)</button>
  </div>

  <!-- Active Loads Container -->
  <div id="view-active-loads"></div>

  <!-- Load Board Pool Container -->
  <div id="view-load-board" style="display: none;"></div>

  <!-- Native Camera / File Input -->
  <input type="file" id="document-file-input" accept="image/*,application/pdf" capture="environment">

  <!-- Driver Profile Modal -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal-card">
      <div class="modal-header">Driver Credentials</div>
      <div class="profile-field">
        <label>Driver Email</label>
        <div id="prof-email">Loading...</div>
      </div>
      <div class="profile-field">
        <label>Assigned Role</label>
        <div id="prof-role">DRIVER</div>
      </div>
      <div class="profile-field">
        <label>Driver UUID</label>
        <div id="prof-id" style="font-family: monospace; font-size: 0.75rem;">Loading...</div>
      </div>
      <div style="margin-top: 1.25rem; display: flex; justify-content: flex-end;">
        <button class="btn-action-sm btn-secondary" id="close-profile-btn">Close</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const SUPABASE_URL = 'https://tiazohjshnhqzdsjtrgo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpYXpvaGpzaG5ocXpkc2p0cmdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNzg3ODQsImV4cCI6MjEwMDg1NDc4NH0.h8C6hws1umRwmV0AvyE0yl9iSG1q7mgJX-4-4_X4SIg';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let activeUploadLoadId = null;

    // Shared Initial Loads Database State
    const DEFAULT_LOADS = [
      { id: 'MM-8012', shipper: 'Amazon Relay Direct', origin: 'Chicago, IL', destination: 'Columbus, OH', equipment: "53' Dry Van", rate: '$1,850', status: 'ASSIGNED', driver_id: null, driver_email: null, docs: [] },
      { id: 'MM-8013', shipper: 'Uber Freight Spot', origin: 'Atlanta, GA', destination: 'Charlotte, NC', equipment: "53' Reefer", rate: '$1,420', status: 'AVAILABLE', driver_id: null, driver_email: null, docs: [] },
      { id: 'MM-8014', shipper: 'TQL Logistics', origin: 'Dallas, TX', destination: 'Houston, TX', equipment: "53' Dry Van", rate: '$950', status: 'AVAILABLE', driver_id: null, driver_email: null, docs: [] },
      { id: 'MM-8015', shipper: 'CH Robinson', origin: 'Phoenix, AZ', destination: 'Denver, CO', equipment: "53' Reefer", rate: '$3,100', status: 'AVAILABLE', driver_id: null, driver_email: null, docs: [] },
      { id: 'MM-8016', shipper: 'Coyote Logistics', origin: 'Memphis, TN', destination: 'Nashville, TN', equipment: "53' Flatbed", rate: '$1,250', status: 'AVAILABLE', driver_id: null, driver_email: null, docs: [] }
    ];

    function getLoads() {
      const stored = localStorage.getItem('mm_matrix_loads');
      if (!stored) {
        localStorage.setItem('mm_matrix_loads', JSON.stringify(DEFAULT_LOADS));
        return DEFAULT_LOADS;
      }
      return JSON.parse(stored);
    }

    function saveLoads(loads) {
      localStorage.setItem('mm_matrix_loads', JSON.stringify(loads));
      window.dispatchEvent(new Event('storage'));
    }

    // Auth Guard
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
      } else {
        const { data: profile } = await supabase
          .from('profiles')
          .select('role')
          .eq('user_id', session.user.id)
          .single();

        if (profile?.role && profile.role !== 'DRIVER') {
          window.location.href = 'dashboard.html';
        } else {
          currentUser = session.user;
          document.body.style.display = 'block';

          // Assign first load to current driver if unassigned demo load
          let loads = getLoads();
          let modified = false;
          loads.forEach(l => {
            if (l.id === 'MM-8012' && !l.driver_id) {
              l.driver_id = currentUser.id;
              l.driver_email = currentUser.email;
              modified = true;
            }
          });
          if (modified) saveLoads(loads);

          document.getElementById('prof-email').innerText = currentUser.email || 'N/A';
          document.getElementById('prof-role').innerText = profile?.role || 'DRIVER';
          document.getElementById('prof-id').innerText = currentUser.id;

          renderViews();
        }
      }
    } catch (err) {
      console.error(err);
      window.location.href = 'index.html';
    }

    // Render Portal Views
    function renderViews() {
      const loads = getLoads();
      const myActiveLoads = loads.filter(l => l.driver_id === currentUser.id && l.status !== 'AVAILABLE');
      const availablePool = loads.filter(l => l.status === 'AVAILABLE');

      document.getElementById('active-count').innerText = myActiveLoads.length;
      document.getElementById('pool-count').innerText = availablePool.length;

      // 1. Render Active Deliveries
      const activeContainer = document.getElementById('view-active-loads');
      if (myActiveLoads.length === 0) {
        activeContainer.innerHTML = `
          <div class="load-card" style="text-align: center; padding: 2rem;">
            <p style="font-weight: 700;">No Active Loads Assigned</p>
            <p style="margin-top: 0.5rem; font-size: 0.8rem;">Switch to the "Load Board Pool" tab to browse and accept available loads.</p>
          </div>`;
      } else {
        activeContainer.innerHTML = myActiveLoads.map(load => `
          <div class="load-card">
            <h3>
              <span>Load #${load.id}</span>
              <span class="rate-tag">${load.rate}</span>
            </h3>
            <p><strong>Shipper:</strong> ${load.shipper}</p>
            <p><strong>Lane:</strong> ${load.origin} → ${load.destination}</p>
            <p><strong>Equipment:</strong> ${load.equipment}</p>
            <p><strong>Status:</strong> <span style="color:var(--success); font-weight:700;">● ${load.status}</span></p>
            
            <div class="upload-container">
              <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Documents & POD Photos (${load.docs ? load.docs.length : 0})</span>
              ${load.docs && load.docs.length > 0 ? `
                <div style="display:flex; gap:0.5rem; margin-top:0.5rem; overflow-x:auto;">
                  ${load.docs.map(doc => `<img src="${doc}" class="upload-preview" style="display:block; height:60px;">`).join('')}
                </div>
              ` : ''}
              <button class="btn-driver btn-secondary" style="margin-top: 0.5rem;" onclick="triggerDocumentUpload('${load.id}')">
                📷 Open Camera / Photos / Files
              </button>
            </div>

            <div class="action-grid">
              <button class="btn-driver" onclick="updateStatus('${load.id}', 'IN_TRANSIT')">Mark En Route</button>
              <button class="btn-driver" onclick="updateStatus('${load.id}', 'DELIVERED')">Mark Delivered</button>
            </div>
            <div style="margin-top: 0.65rem;">
              <button class="btn-driver btn-warning" onclick="releaseLoad('${load.id}')">
                ↺ Cancel & Release Back To Load Board
              </button>
            </div>
          </div>
        `).join('');
      }

      // 2. Render Available Load Board Pool
      const boardContainer = document.getElementById('view-load-board');
      if (availablePool.length === 0) {
        boardContainer.innerHTML = `
          <div class="load-card" style="text-align: center; padding: 2rem;">
            <p style="font-weight: 700;">No Available Loads in Pool</p>
            <p style="margin-top: 0.5rem; font-size: 0.8rem;">Check back shortly for newly posted shipper routes.</p>
          </div>`;
      } else {
        boardContainer.innerHTML = availablePool.map(load => `
          <div class="load-card">
            <h3>
              <span>Load #${load.id}</span>
              <span class="rate-tag">${load.rate}</span>
            </h3>
            <p><strong>Shipper / Broker:</strong> ${load.shipper}</p>
            <p><strong>Lane:</strong> ${load.origin} → ${load.destination}</p>
            <p><strong>Equipment:</strong> ${load.equipment}</p>
            <div style="margin-top: 1rem;">
              <button class="btn-driver" onclick="acceptLoad('${load.id}')">
                ✓ Accept Load Immediately
              </button>
            </div>
          </div>
        `).join('');
      }
    }

    // Driver Load Operations
    window.acceptLoad = function(loadId) {
      let loads = getLoads();
      const target = loads.find(l => l.id === loadId);
      if (target) {
        target.status = 'ASSIGNED';
        target.driver_id = currentUser.id;
        target.driver_email = currentUser.email;
        saveLoads(loads);
        alert(`Load #${loadId} accepted! It has been moved to your Active Deliveries.`);
        renderViews();
      }
    };

    window.releaseLoad = function(loadId) {
      if (confirm(`Are you sure you want to cancel and release Load #${loadId} back to the Load Board?`)) {
        let loads = getLoads();
        const target = loads.find(l => l.id === loadId);
        if (target) {
          target.status = 'AVAILABLE';
          target.driver_id = null;
          target.driver_email = null;
          saveLoads(loads);
          alert(`Load #${loadId} has been released back to the Load Board pool.`);
          renderViews();
        }
      }
    };

    window.updateStatus = function(loadId, newStatus) {
      let loads = getLoads();
      const target = loads.find(l => l.id === loadId);
      if (target) {
        target.status = newStatus;
        saveLoads(loads);
        renderViews();
      }
    };

    // Camera / Photos / Files Upload Handler
    const fileInput = document.getElementById('document-file-input');

    window.triggerDocumentUpload = function(loadId) {
      activeUploadLoadId = loadId;
      fileInput.click();
    };

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file || !activeUploadLoadId) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const fileDataUrl = event.target.result;
        let loads = getLoads();
        const target = loads.find(l => l.id === activeUploadLoadId);
        if (target) {
          if (!target.docs) target.docs = [];
          target.docs.push(fileDataUrl);
          saveLoads(loads);
          alert(`Document/Photo attached successfully to Load #${activeUploadLoadId}!`);
          renderViews();
        }
      };
      reader.readAsDataURL(file);
      fileInput.value = '';
    });

    // Navigation Switching
    window.switchDriverTab = function(tab) {
      document.getElementById('tab-active').classList.toggle('active', tab === 'active');
      document.getElementById('tab-board').classList.toggle('active', tab === 'board');
      document.getElementById('view-active-loads').style.display = tab === 'active' ? 'block' : 'none';
      document.getElementById('view-load-board').style.display = tab === 'board' ? 'block' : 'none';
    };

    // Listen for cross-tab updates
    window.addEventListener('storage', () => renderViews());

    // Profile Modal Event Handlers
    document.getElementById('open-profile-btn').addEventListener('click', () => {
      document.getElementById('profile-modal').style.display = 'flex';
    });
    document.getElementById('close-profile-btn').addEventListener('click', () => {
      document.getElementById('profile-modal').style.display = 'none';
    });
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
