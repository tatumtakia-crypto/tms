<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

  <!-- Navigation -->
  <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <a href="index.html" class="text-2xl font-bold text-blue-500">FleetFlow</a>
      <span class="text-xs bg-yellow-900 text-yellow-300 px-2 py-0.5 rounded font-semibold">Driver Portal</span>
    </div>
    <div class="flex space-x-6 text-sm font-medium">
      <a href="index.html" class="text-gray-300 hover:text-white transition">Home</a>
      <a href="dashboard.html" class="text-gray-300 hover:text-white transition">Dashboard</a>
      <a href="loadboard.html" class="text-gray-300 hover:text-white transition">Loadboard</a>
      <a href="driver-portal.html" class="text-yellow-400 font-bold">Driver Portal</a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 py-8">
    <!-- Header with Link to Loadboard -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
      <div>
        <h1 class="text-3xl font-bold">Assigned Driver Loads</h1>
        <p class="text-sm text-gray-400 mt-1">Filter loads assigned to your driver ID or browse all available loads on the loadboard.</p>
      </div>
      <a href="loadboard.html" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
        Browse Main Loadboard
      </a>
    </div>

    <!-- Driver ID Filter Box -->
    <div class="bg-gray-800 p-4 rounded-xl mb-6 border border-gray-700 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3 w-full sm:w-auto">
        <label class="text-sm font-medium text-gray-300 whitespace-nowrap">Driver ID:</label>
        <input type="text" id="driver-filter" placeholder="Enter Driver UUID or Name" class="w-full sm:w-64 bg-gray-700 text-white px-3 py-2 rounded-lg border border-gray-600 text-sm focus:outline-none focus:border-blue-500" />
        <button onclick="fetchDriverLoads()" class="bg-yellow-600 hover:bg-yellow-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
          Filter
        </button>
      </div>
      <button onclick="clearFilter()" class="text-xs text-gray-400 hover:text-gray-200 underline">
        Show All Assigned Loads
      </button>
    </div>

    <!-- Assigned Loads List -->
    <div id="driver-loads-container" class="space-y-4">
      <div class="text-center py-10 text-gray-400" id="driver-loading">
        Connecting to database...
      </div>
    </div>
  </main>

  <script>
    // Initialize Supabase Client
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const container = document.getElementById('driver-loads-container');

    // Fetch Driver Loads Directly from Supabase
    async function fetchDriverLoads() {
      const driverId = document.getElementById('driver-filter').value.trim();
      container.innerHTML = `<div class="text-center py-10 text-gray-400">Fetching loads from Supabase...</div>`;

      let query = supabase.from('loads').select('*').order('created_at', { ascending: false });

      if (driverId) {
        query = query.eq('driver_id', driverId);
      }

      const { data: loads, error } = await query;

      if (error) {
        console.error('Error fetching driver loads:', error);
        container.innerHTML = `<div class="text-red-400 text-center py-6">Failed to load data from Supabase.</div>`;
        return;
      }

      renderDriverLoads(loads);
    }

    // Render Driver Load Cards
    function renderDriverLoads(loads) {
      if (!loads || loads.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 text-gray-400 bg-gray-800 rounded-xl border border-gray-700">
            <p class="mb-4">No loads found matching this Driver ID.</p>
            <a href="loadboard.html" class="text-blue-400 hover:underline text-sm font-semibold">View Available Loads on Loadboard &rarr;</a>
          </div>`;
        return;
      }

      container.innerHTML = loads.map(load => `
        <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs px-2.5 py-1 rounded font-bold uppercase ${
              load.status === 'delivered' ? 'bg-green-900 text-green-300' :
              load.status === 'in_transit' ? 'bg-yellow-900 text-yellow-300' : 'bg-blue-900 text-blue-300'
            }">
              ${load.status || 'available'}
            </span>
            <span class="text-lg font-extrabold text-green-400">$${load.rate}</span>
          </div>

          <div>
            <h2 class="text-xl font-bold">${load.origin} ➔ ${load.destination}</h2>
            <p class="text-xs text-gray-500 mt-0.5">Load ID: ${load.id} | Driver: ${load.driver_id || 'Unassigned'}</p>
          </div>

          <div class="pt-3 border-t border-gray-700 flex justify-between items-center">
            <span class="text-xs text-gray-400">Update Status:</span>
            <div class="space-x-2">
              <button onclick="updateLoadStatus('${load.id}', 'in_transit')" class="px-3 py-1 bg-yellow-600 hover:bg-yellow-500 text-xs rounded font-medium transition">
                In Transit
              </button>
              <button onclick="updateLoadStatus('${load.id}', 'delivered')" class="px-3 py-1 bg-green-600 hover:bg-green-500 text-xs rounded font-medium transition">
                Delivered
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Update Status in Supabase
    async function updateLoadStatus(loadId, newStatus) {
      const { error } = await supabase
        .from('loads')
        .update({ status: newStatus })
        .eq('id', loadId);

      if (error) {
        alert('Failed to update load: ' + error.message);
      } else {
        fetchDriverLoads();
      }
    }

    function clearFilter() {
      document.getElementById('driver-filter').value = '';
      fetchDriverLoads();
    }

    // Realtime Listener
    function subscribeDriverRealtime() {
      supabase
        .channel('driver:loads')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'loads' }, () => {
          fetchDriverLoads();
        })
        .subscribe();
    }

    // On Load
    fetchDriverLoads();
    subscribeDriverRealtime();
  </script>
</body>
</html>
