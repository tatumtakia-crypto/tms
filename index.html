<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastermind Matrix: The Black Label - Authentication</title>
  <style>
    :root {
      --bg-primary: #060911;
      --bg-surface: #0f1626;
      --bg-card: #141f36;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --metallic-blue: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 50%, #1e40af 100%);
      --metallic-silver: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 50%, #64748b 100%);
      --border-metallic: 1px solid rgba(148, 163, 184, 0.25);
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, system-ui, sans-serif; }
    
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .login-card {
      background: var(--bg-surface);
      border: var(--border-metallic);
      border-radius: 1rem;
      width: 100%;
      max-width: 440px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--metallic-blue);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: var(--metallic-silver);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 0.7rem;
      color: #06b6d4;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.35rem;
      font-weight: 700;
    }

    .form-control {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #080d1a;
      border: var(--border-metallic);
      border-radius: 0.5rem;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
    }

    select.form-control {
      appearance: none;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      font-size: 0.9rem;
      font-weight: 800;
      border-radius: 0.5rem;
      border: var(--border-metallic);
      background: var(--metallic-blue);
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      filter: brightness(1.2);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
    }

    .auth-toggle {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .auth-toggle a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      margin-left: 0.25rem;
    }

    .auth-toggle a:hover {
      text-decoration: underline;
    }

    .alert-msg {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: none;
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-header">
      <div class="brand-title">Mastermind Matrix</div>
      <div class="brand-subtitle">The Black Label • Terminal Authentication</div>
    </div>

    <div class="alert-msg alert-danger" id="error-msg"></div>
    <div class="alert-msg alert-success" id="success-msg"></div>

    <form id="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="operator@mastermind.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••••••" required>
      </div>

      <div class="form-group" id="role-group" style="display: none;">
        <label for="role">Select Account Type</label>
        <select id="role" class="form-control">
          <option value="DISPATCH">Enterprise Operator / Dispatcher</option>
          <option value="DRIVER">Fleet Driver / Carrier</option>
        </select>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Authenticate Session</button>
    </form>

    <div class="auth-toggle">
      <span id="toggle-text">Need terminal access?</span>
      <a href="#" id="toggle-mode-btn">Register Account</a>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const SUPABASE_URL = 'https://tiazohjshnhqzdsjtrgo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpYXpvaGpzaG5ocXpkc2p0cmdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNzg3ODQsImV4cCI6MjEwMDg1NDc4NH0.h8C6hws1umRwmV0AvyE0yl9iSG1q7mgJX-4-4_X4SIg';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUp = false;

    const authForm = document.getElementById('auth-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const roleSelect = document.getElementById('role');
    const roleGroup = document.getElementById('role-group');
    const submitBtn = document.getElementById('submit-btn');
    const toggleBtn = document.getElementById('toggle-mode-btn');
    const toggleText = document.getElementById('toggle-text');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');

    // Auto-Redirect if user is already authenticated
    async function checkExistingSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        await routeUserByRole(session.user.id);
      }
    }
    checkExistingSession();

    // Route user based on database profile role
    async function routeUserByRole(userId) {
      try {
        const { data: profile } = await supabase
          .from('profiles')
          .select('role')
          .eq('user_id', userId)
          .single();

        if (profile?.role === 'DRIVER') {
          window.location.href = 'driver-portal.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        window.location.href = 'dashboard.html';
      }
    }

    // Toggle between Sign In and Sign Up modes
    toggleBtn.addEventListener('click', (e) => {
      e.preventDefault();
      isSignUp = !isSignUp;
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      if (isSignUp) {
        roleGroup.style.display = 'block';
        submitBtn.innerText = 'Register & Request Access';
        toggleText.innerText = 'Already have an active account?';
        toggleBtn.innerText = 'Sign In';
      } else {
        roleGroup.style.display = 'none';
        submitBtn.innerText = 'Authenticate Session';
        toggleText.innerText = 'Need terminal access?';
        toggleBtn.innerText = 'Register Account';
      }
    });

    // Handle Auth Submission
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      submitBtn.disabled = true;

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const selectedRole = roleSelect.value;

      try {
        if (isSignUp) {
          // Sign Up New User
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
          });

          if (error) throw error;

          if (data?.user) {
            // Upsert Profile Record with Selected Role
            await supabase.from('profiles').upsert({
              user_id: data.user.id,
              role: selectedRole,
            });

            successMsg.innerText = 'Account registered successfully! Logging in...';
            successMsg.style.display = 'block';

            setTimeout(() => {
              routeUserByRole(data.user.id);
            }, 1200);
          }
        } else {
          // Sign In Existing User
          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password,
          });

          if (error) throw error;

          if (data?.user) {
            await routeUserByRole(data.user.id);
          }
        }
      } catch (err) {
        errorMsg.innerText = err.message || 'Authentication failed. Please try again.';
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
