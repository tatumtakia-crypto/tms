<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastermind Matrix: The Black Label - High-Tech TMS</title>
  <style>
    :root {
      --bg-primary: #060911;
      --bg-surface: #0f1626;
      --bg-card: #141f36;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --metallic-blue: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 50%, #1e40af 100%);
      --metallic-silver: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 50%, #64748b 100%);
      --border-metallic: 1px solid rgba(148, 163, 184, 0.25);
      --glow-blue: 0 0 20px rgba(59, 130, 246, 0.4);
      --accent-cyan: #06b6d4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, system-ui, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; background-image: radial-gradient(circle at 50% 15%, #1e293b 0%, #060911 85%); }
    .login-box { width: 100%; max-width: 440px; padding: 3rem 2.5rem; background: var(--bg-surface); border: var(--border-metallic); border-radius: 1rem; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), var(--glow-blue); position: relative; overflow: hidden; }
    .login-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--metallic-blue); }
    .brand-header { text-align: center; margin-bottom: 2.5rem; }
    .brand-title { font-size: 1.4rem; font-weight: 900; letter-spacing: 2.5px; background: var(--metallic-silver); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
    .brand-subtitle { font-size: 0.7rem; font-weight: 700; color: var(--accent-cyan); letter-spacing: 3.5px; text-transform: uppercase; margin-top: 0.4rem; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    input { width: 100%; padding: 0.875rem 1rem; border: var(--border-metallic); border-radius: 0.5rem; background: #080d1a; color: var(--text-main); font-size: 1rem; transition: all 0.3s ease; }
    input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 12px rgba(59, 130, 246, 0.4); }
    .btn { width: 100%; background: var(--metallic-blue); color: white; border: var(--border-metallic); padding: 0.875rem; border-radius: 0.5rem; font-weight: 700; cursor: pointer; transition: all 0.3s; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.4); }
    .btn:hover { filter: brightness(1.2); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6); transform: translateY(-1px); }
    .error-msg { color: #f87171; font-size: 0.875rem; margin-top: 0.75rem; display: none; text-align: center; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand-header">
      <div class="brand-title">Mastermind Matrix</div>
      <div class="brand-subtitle">The Black Label • High-Tech TMS OS</div>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label>Operator / Carrier ID</label>
        <input type="email" id="email" required placeholder="user@company.com">
      </div>
      <div class="form-group">
        <label>Neural Passkey</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <div id="error-alert" class="error-msg"></div>
      <button type="submit" class="btn" style="margin-top: 0.5rem;">Initialize Session</button>
    </form>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const SUPABASE_URL = 'https://tiazohjshnhqzdsjtrgo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpYXpvaGpzaG5ocXpkc2p0cmdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNzg3ODQsImV4cCI6MjEwMDg1NDc4NH0.h8C6hws1umRwmV0AvyE0yl9iSG1q7mgJX-4-4_X4SIg';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Auto-redirect if already logged in
    async function checkExistingAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        routeUser(session.user.id);
      }
    }

    async function routeUser(userId) {
      const { data: profile } = await supabase.from('profiles').select('role').or(`user_id.eq.${userId},id.eq.${userId}`).single();
      const role = profile?.role?.toUpperCase() || 'DRIVER';

      if (role === 'ADMIN') {
        window.location.href = 'admin.html';
      } else if (role === 'DRIVER') {
        window.location.href = 'driver-portal.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('error-alert');
      errorAlert.style.display = 'none';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        errorAlert.innerText = error.message;
        errorAlert.style.display = 'block';
        return;
      }
      
      routeUser(data.user.id);
    });

    checkExistingAuth();
  </script>
</body>
</html>
