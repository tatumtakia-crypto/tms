<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dispatch Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

  <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
    <div class="flex items-center space-x-3">
      <a href="index.html" class="text-2xl font-bold text-blue-500">FleetFlow</a>
      <span id="role-badge" class="text-xs bg-gray-700 text-gray-300 px-2.5 py-0.5 rounded-full font-semibold uppercase">Dashboard</span>
    </div>

    <div class="flex space-x-6 text-sm font-medium">
      <a href="index.html" class="text-gray-300 hover:text-white transition">Home</a>
      <a href="dashboard.html" class="text-blue-400 font-bold">Dashboard</a>
      <a href="loadboard.html" class="text-gray-300 hover:text-white transition">Loadboard</a>
      <a href="driver-portal.html" id="nav-driver" class="text-gray-300 hover:text-white transition">Driver Portal</a>
    </div>

    <div class="flex items-center space-x-3 text-sm">
      <a href="profile.html" class="flex items-center space-x-2 bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg border border-gray-600 transition">
        <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold" id="user-avatar">U</div>
        <span id="user-display-name" class="font-medium">Profile</span>
      </a>
      <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">
        Logout
      </button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-8">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-bold">Dispatch Overview</h1>
        <p class="text-gray-400 text-sm mt-1">Live metrics synced with Supabase</p>
      </div>
      <a href="loadboard.html" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
        + Post Load on Loadboard
      </a>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Loads</p>
        <p id="stat-total" class="text-3xl font-bold mt-2 text-white">--</p>
      </div>
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Available Loads</p>
        <p id="stat-available" class="text-3xl font-bold mt-2 text-green-400">--</p>
      </div>
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">In Transit</p>
        <p id="stat-transit" class="text-3xl font-bold mt-2 text-yellow-400">--</p>
      </div>
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Delivered</p>
        <p id="stat-delivered" class="text-3xl font-bold mt-2 text-blue-400">--</p>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function initDashboard() {
      // Require Authentication
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      // Fetch Profile from Supabase
      const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
      const role = profile?.role || 'driver';

      // Redirect Drivers Away from Dispatcher Dashboard
      if (role === 'driver') {
        window.location.href = 'driver-portal.html';
        return;
      }

      const name = profile?.full_name || user.email.split('@')[0];
      document.getElementById('role-badge').innerText = role;
      document.getElementById('user-display-name').innerText = name;
      document.getElementById('user-avatar').innerText = name.charAt(0).toUpperCase();

      loadMetrics();
    }

    async function loadMetrics() {
      const { data: loads } = await supabase.from('loads').select('status');
      if (loads) {
        document.getElementById('stat-total').innerText = loads.length;
        document.getElementById('stat-available').innerText = loads.filter(l => l.status === 'available' || !l.status).length;
        document.getElementById('stat-transit').innerText = loads.filter(l => l.status === 'in_transit').length;
        document.getElementById('stat-delivered').innerText = loads.filter(l => l.status === 'delivered').length;
      }
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    }

    initDashboard();
  </script>
</body>
</html>
