<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - FleetFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-gray-800 p-8 rounded-2xl border border-gray-700 shadow-xl space-y-6">
    <div class="text-center">
      <h1 class="text-3xl font-extrabold text-blue-500">FleetFlow</h1>
      <p class="text-gray-400 text-sm mt-1">Sign in to access your dashboard</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Email</label>
        <input type="email" id="email" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="user@company.com" />
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Password</label>
        <input type="password" id="password" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="••••••••" />
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg transition">
        Sign In
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data: { user }, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        alert('Login failed: ' + error.message);
        return;
      }

      // Fetch Role from Supabase profiles table
      const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).single();
      const role = profile?.role || 'driver';

      // Route user according to role
      if (role === 'driver') {
        window.location.href = 'driver-portal.html';
      } else if (role === 'dispatcher' || role === 'admin') {
        window.location.href = 'dashboard.html';
      } else {
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
