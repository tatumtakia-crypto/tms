<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between">

  <!-- Navigation Bar -->
  <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <a href="index.html" class="text-2xl font-bold text-blue-500">FleetFlow</a>
      <span class="text-xs bg-gray-700 text-gray-300 px-2 py-0.5 rounded font-semibold">User Profile</span>
    </div>
    <div class="flex space-x-6 text-sm font-medium">
      <a href="index.html" class="text-gray-300 hover:text-white transition">Home</a>
      <a href="dashboard.html" class="text-gray-300 hover:text-white transition">Dashboard</a>
      <a href="loadboard.html" class="text-gray-300 hover:text-white transition">Loadboard</a>
      <a href="driver-portal.html" class="text-gray-300 hover:text-white transition">Driver Portal</a>
    </div>
  </nav>

  <!-- Profile Card -->
  <main class="max-w-xl mx-auto px-6 py-12 w-full">
    <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700 shadow-xl space-y-6">
      <div class="flex items-center space-x-4 border-b border-gray-700 pb-6">
        <div class="w-16 h-16 rounded-full bg-blue-600 flex items-center justify-center text-2xl font-bold text-white" id="avatar-big">
          U
        </div>
        <div>
          <h1 class="text-2xl font-bold" id="profile-name">User Account</h1>
          <p class="text-sm text-gray-400" id="profile-email">loading...</p>
          <span id="profile-role-badge" class="inline-block mt-2 text-xs bg-blue-900 text-blue-300 px-2.5 py-0.5 rounded-full font-semibold uppercase">
            driver
          </span>
        </div>
      </div>

      <!-- Account Settings / Metadata Form -->
      <form onsubmit="handleSaveProfile(event)" class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Full Name</label>
          <input type="text" id="input-fullname" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="Enter Full Name" />
        </div>

        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Assigned Role</label>
          <select id="select-role" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
            <option value="driver">Driver</option>
            <option value="dispatcher">Dispatcher</option>
            <option value="admin">Administrator</option>
          </select>
        </div>

        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">User ID (UUID)</label>
          <input type="text" id="input-uid" readonly class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-xs text-gray-400 cursor-not-allowed" />
        </div>

        <div class="flex justify-between items-center pt-4 border-t border-gray-700">
          <button type="button" onclick="handleLogout()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
            Logout
          </button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg text-sm font-semibold transition">
            Save Profile
          </button>
        </div>
      </form>
    </div>
  </main>

  <footer class="bg-gray-800 border-t border-gray-700 text-center py-4 text-xs text-gray-500">
    &copy; 2026 FleetFlow Logistics System.
  </footer>

  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    async function loadUserProfile() {
      const { data: { user } } = await supabase.auth.getUser();

      if (!user) {
        alert('Please log in to view your profile.');
        window.location.href = 'index.html';
        return;
      }

      currentUser = user;
      document.getElementById('input-uid').value = user.id;
      document.getElementById('profile-email').innerText = user.email;

      const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();

      const fullName = profile?.full_name || user.user_metadata?.full_name || user.email.split('@')[0];
      const role = profile?.role || user.user_metadata?.role || 'driver';

      document.getElementById('profile-name').innerText = fullName;
      document.getElementById('input-fullname').value = fullName;
      document.getElementById('select-role').value = role;
      document.getElementById('profile-role-badge').innerText = role;
      document.getElementById('avatar-big').innerText = fullName.charAt(0).toUpperCase();
    }

    async function handleSaveProfile(e) {
      e.preventDefault();
      const updatedName = document.getElementById('input-fullname').value;
      const updatedRole = document.getElementById('select-role').value;

      const { error } = await supabase.from('profiles').upsert({
        id: currentUser.id,
        full_name: updatedName,
        role: updatedRole,
        updated_at: new Date().toISOString()
      });

      if (error) {
        alert('Failed to update profile: ' + error.message);
      } else {
        alert('Profile and role updated successfully!');
        window.location.reload();
      }
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    }

    loadUserProfile();
  </script>
</body>
</html>
