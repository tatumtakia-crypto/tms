<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastermind Matrix - Operator Profile</title>
  <style>
    :root {
      --bg-primary: #060911;
      --bg-surface: #0f1626;
      --bg-card: #141f36;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --metallic-blue: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 50%, #1e40af 100%);
      --metallic-silver: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 50%, #64748b 100%);
      --border-metallic: 1px solid rgba(148, 163, 184, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, system-ui, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; display: flex; justify-content: center; }
    .profile-card { width: 100%; max-width: 500px; background: var(--bg-surface); border: var(--border-metallic); border-radius: 1rem; padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .profile-header { text-align: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: var(--border-metallic); }
    .profile-header h1 { font-size: 1.25rem; font-weight: 900; background: var(--metallic-silver); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.4rem; }
    input { width: 100%; padding: 0.75rem; background: #080d1a; border: var(--border-metallic); border-radius: 0.5rem; color: #fff; font-size: 0.9rem; }
    input[readonly] { color: var(--text-muted); cursor: not-allowed; }
    .btn-actions { display: flex; justify-content: space-between; margin-top: 1.5rem; }
    .btn { background: var(--metallic-blue); color: white; border: none; padding: 0.75rem 1.25rem; border-radius: 0.5rem; font-weight: 700; cursor: pointer; text-transform: uppercase; text-decoration: none; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="profile-header">
      <h1>Operator Profile</h1>
      <p style="font-size:0.75rem; color:#06b6d4; margin-top:4px;">Mastermind Matrix OS</p>
    </div>

    <form id="profile-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="full_name" required>
      </div>
      <div class="form-group">
        <label>Role (Pulled from Supabase)</label>
        <input type="text" id="role" readonly>
      </div>
      <div class="form-group">
        <label>Account ID (UUID)</label>
        <input type="text" id="user_id" readonly>
      </div>

      <div class="btn-actions">
        <a href="dashboard.html" class="btn" style="background:#1e293b;">&larr; Back</a>
        <button type="submit" class="btn">Save Profile</button>
      </div>
    </form>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const SUPABASE_URL = 'https://tiazohjshnhqzdsjtrgo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpYXpvaGpzaG5ocXpkc2p0cmdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNzg3ODQsImV4cCI6MjEwMDg1NDc4NH0.h8C6hws1umRwmV0AvyE0yl9iSG1q7mgJX-4-4_X4SIg';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserId = null;

    async function loadProfile() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      currentUserId = session.user.id;
      document.getElementById('user_id').value = currentUserId;

      const { data: profile } = await supabase.from('profiles').select('*').or(`user_id.eq.${currentUserId},id.eq.${currentUserId}`).single();

      document.getElementById('full_name').value = profile?.full_name || profile?.name || session.user.email.split('@')[0];
      document.getElementById('role').value = (profile?.role || 'DRIVER').toUpperCase();
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const updatedName = document.getElementById('full_name').value;

      const { error } = await supabase.from('profiles').upsert({
        user_id: currentUserId,
        id: currentUserId,
        full_name: updatedName,
        updated_at: new Date().toISOString()
      });

      if (error) alert(error.message);
      else alert('Profile updated successfully!');
    });

    loadProfile();
  </script>
</body>
</html>
